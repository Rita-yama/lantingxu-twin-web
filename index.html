  });
  FLOORS.forEach(f => st.insertAdjacentHTML("beforeend", `<div class="ftag" style="top:${f.top+LH*0.62}rem">${f.id}</div>`));
  // 點選範圍：重疊處以已建置樓層優先
  [...FLOORS].sort((a,b)=>a.built-b.built).forEach(f => {
    st.insertAdjacentHTML("beforeend", `<div class="hit" data-f="${FLOORS.indexOf(f)}" style="top:${f.top}rem" title="${f.id}"></div>`);
  });
  FLOORS.forEach((f,i) => {
    const ax = SX + LW*AX, ay = f.top + LH*AY, cy = f.top + LH*0.5 + 2;
    cards.insertAdjacentHTML("beforeend",
      `<div class="hlead" id="hl${i}" style="left:${ax}rem;top:${ay}rem;width:${Math.hypot(CX-ax,cy-ay)}rem;transform:rotate(${Math.atan2(cy-ay,CX-ax)}rad)"></div>
       <div class="fcard ${f.built?"":"ph"}" id="fc${i}" data-f="${i}" style="top:${cy}rem"></div>`);
  });
  $("menu").innerHTML = MENU.map(m => m < 0 ? `<button class="all" data-f="-1">全棟</button>`
      : `<button class="${FLOORS[m].built?"":"ph"}" data-f="${m}">${FLOORS[m].id}</button>`).join("");
  document.querySelectorAll("[data-f]").forEach(el => el.addEventListener("click", () => {
    sel = +el.dataset.f; drawSel(); if(sel >= 0) enter(sel);
  }));
  $("bF").textContent = FLOORS.filter(f=>f.built).length;
}
function fcard(f){
  const n = f.built ? f.devices.length : 0;
  return `<div class="top"><span class="fno">${f.id}</span><div class="nm"><b>嵐庭旭 ${f.id}</b>
    <span>${f.built ? `${n} 台設備・點選進入` : "尚未建置"}</span></div></div>
    <div class="data"><div><i>即時總功率</i><b>${f.built?fw(floorW(f)):"—"}</b><i>瓦</i></div>
    <div><i>今日累積</i><b>${f.built?f2(floorK(f)):"—"}</b><i>度</i></div>
    <div><i>設備</i><b>${f.built?n:"—"}</b><i>台</i></div></div>`;
}
function drawHome(){
  FLOORS.forEach((f,i) => $("fc"+i).innerHTML = fcard(f));
  // v40：全棟＝逆變器整棟數據（/Energy/getStatus）；讀不到時退回各層插座加總
  $("bW").textContent = Math.round(EN ? EN.home*1000 : FLOORS.reduce((s,f)=>s+floorW(f),0)).toLocaleString("en-US");
  $("bK").textContent = EN ? f2(EN.todayKwh) : "—";
}
function drawSel(){
  FLOORS.forEach((f,i) => {
    const on = i === sel;
    $("ly"+i).classList.toggle("sel", on && f.built);
    $("ly"+i).classList.toggle("dim", sel >= 0 && !on && f.built);
    $("fc"+i).classList.toggle("sel", on); $("hl"+i).classList.toggle("sel", on);
  });
  document.querySelectorAll("#menu button").forEach(b => b.classList.toggle("sel", +b.dataset.f === sel));
}
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200); }
function setHeld(h){
  held = h; clearTimeout(autoT); clearTimeout(idleT); $("go").textContent = "";
  auto = false; if(!held) idleT = setTimeout(startAuto, IDLE_MS);
  drawMode();
}
function drawMode(){
  const txt = auto ? "能源標籤畫面" : held ? "已暫停・可自己點選" : "手動操作・10 秒沒動作就顯示能源標籤畫面";
  [$("hmode"), $("fmode")].forEach(e => { e.textContent = txt; e.classList.toggle("auto", auto); });
  $("hint").innerHTML = "遙控器：<b>↑ ↓</b> 選樓層　<b>OK</b> 進入";
  $("tv").classList.toggle("held", held);
  [$("hpause"), $("fpause")].forEach(b => { b.textContent = held ? "▶ 繼續自動切換" : "⏸ 暫停自動切換"; b.classList.toggle("on", held); });
}

/* ---------- 切換畫面 ---------- */
function enter(i){
  const f = FLOORS[i];
  if(!f.built){ toast(`${f.id} 尚未建置`); return; }
  FL = i; L = f.devices;
  $("base").src = f.base; $("stage").style.backgroundImage = `url(${f.base})`; $("base").alt = `嵐庭旭 ${f.id} 3D 鳥瞰圖`;
  $("ftitle").textContent = `嵐庭旭 ${f.id}・家電能源狀態`; $("tlab").textContent = f.id;
  $("total").textContent = Math.round(L.reduce((s,a)=>s+watt(a),0)).toLocaleString("en-US");
  view = "floor"; $("homeView").hidden = true; $("tv").hidden = false; buildRank(); buildDots(); show(0);
}
function goHome(){ view = "home"; $("tv").hidden = true; $("homeView").hidden = false; drawHome(); drawSel(); }

/* ---------- 自動輪播：首頁停一下 → 進入已建置樓層 → 輪播該層設備 → 回首頁 → 重複 ---------- */
function nextBuilt(){
  const order = [2,1,0];  // 由下往上：1F → 2F → 5F，未建置的跳過
  const k0 = order.indexOf(autoFloor);
  for(let k=1;k<=order.length;k++){ const i = order[(k0+k+order.length) % order.length]; if(FLOORS[i].built) return i; }
  return -1;
}
function autoHome(){
  goHome(); const i = nextBuilt(); if(i < 0) return;
  autoFloor = i; sel = i; drawSel();
  $("go").textContent = `即將進入 ${FLOORS[i].id}…`;
  autoT = setTimeout(() => { $("go").textContent = ""; enter(i); autoT = setTimeout(autoDevice, STEP_MS); }, HOME_DWELL_MS);
}
function autoDevice(){
  if(cur >= L.length-1){ autoHome(); return; }
  show(cur+1); autoT = setTimeout(autoDevice, STEP_MS);
}
function startAuto(){
  if(held) return;
  auto = true; drawMode(); $("idle").hidden = false;  // v38：改成停在能源標籤畫面，不再輪播
}
function userActive(){
  clearTimeout(autoT); clearTimeout(idleT); $("go").textContent = "";
  auto = false; drawMode(); $("idle").hidden = true;
  if(!held) idleT = setTimeout(startAuto, IDLE_MS);
}
["pointerdown","wheel","touchstart"].forEach(ev => document.addEventListener(ev, e => {
  if(!$("idle").hidden && e.target.closest && e.target.closest("#idle .tag")){ clearTimeout(idleT); return; }  // 拖曳標籤不離開待機畫面
  userActive();
}, {capture:true, passive:true}));

/* v38 待機畫面標籤：可拖曳、位置記在這台瀏覽器；家庭用電＝已連線插座功率加總（真實數據） */
const TAGKEY = "lanting-idle-tags-v38";
let tagPos = {}; try { tagPos = JSON.parse(localStorage.getItem(TAGKEY)) || {}; } catch(e) {}
document.querySelectorAll("#idle .tag").forEach(el => {
  const p = tagPos[el.dataset.k]; if(p){ el.style.left = p.x + "%"; el.style.top = p.y + "%"; }
  el.addEventListener("pointerdown", e => {
    el.setPointerCapture(e.pointerId); const r = el.parentNode.getBoundingClientRect();
    const mv = ev => { const x = Math.min(100,Math.max(0,(ev.clientX-r.left)/r.width*100)), y = Math.min(100,Math.max(0,(ev.clientY-r.top)/r.height*100));
      el.style.left = x + "%"; el.style.top = y + "%"; tagPos[el.dataset.k] = {x, y}; };
    const up = () => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up);
      try { localStorage.setItem(TAGKEY, JSON.stringify(tagPos)); } catch(e) {} };
    el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up);
  });
});
/* v40 首頁整棟能源（參照 yamaPad：YamaHomeApi /Energy/getStatus，不用金鑰）。
   adminID/homeID 不寫在原始碼：電視網址後面加 #a=adminID&h=homeID，第一次開啟記在這台瀏覽器。 */
const EAPI = "https://hje5p8e573.execute-api.ap-northeast-1.amazonaws.com/dev";
const IDKEY = "lanting-home-ids";
let IDS = null;
(() => {
  const q = new URLSearchParams(location.hash.slice(1));
  if(q.get("a") && q.get("h")){ IDS = {a:q.get("a"), h:q.get("h")}; try { localStorage.setItem(IDKEY, JSON.stringify(IDS)); } catch(e) {} }
  else { try { IDS = JSON.parse(localStorage.getItem(IDKEY)); } catch(e) {} }
})();
let EN = null;   // {pv, grid, bat, soc, home, todayKwh}（kW／度）
async function pollEnergy(){
  if(!IDS) return;
  const d = new Date(), day = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  try{
    const r = await fetch(`${EAPI}/Energy/getStatus?adminID=${encodeURIComponent(IDS.a)}&homeID=${encodeURIComponent(IDS.h)}&date=${day}`, {cache:"no-store"});
    const j = await r.json(), x = j && j.data, fi = x && x.flowInfo; if(!fi) throw 0;
    EN = { pv:+fi.PVPower||0, grid:+fi.GridPower||0, bat:+fi.BatteryChargePower||0, soc:+fi.battery||0, home:+fi.home||0,
           todayKwh: +(x.day && x.day.todayConsumption) || 0 };
    const by = {}; ((x.day && x.day.plugConsumptionList) || []).forEach(p => by[p.deviceID] = +p.consumptionKwh || 0);
    [...LIST, ...LIST1F, ...LIST5F].forEach(a => a.today = a.dev ? (by[a.dev] || 0) : 0);
  }catch(e){ /* 保留上一次數值 */ }
  drawIdle(); if(view === "home") drawHome();
}
function drawIdle(){
  if(EN){
    $("idleSolar").textContent = EN.pv.toFixed(2) + " kW";
    // 正負號：市電 負＝用電、正＝賣電；電池 負＝放電、正＝充電
    $("idleGrid").textContent = Math.abs(EN.grid) < 0.005 ? "0.00 kW" : (EN.grid < 0 ? "用電 " : "賣電 ") + Math.abs(EN.grid).toFixed(2) + " kW";
    $("idleBatt").textContent = (Math.abs(EN.bat) < 0.005 ? "待機 0.00 kW" : (EN.bat < 0 ? "放電 " : "充電 ") + Math.abs(EN.bat).toFixed(2) + " kW") + " · " + Math.round(EN.soc) + "%";
    $("idleHome").textContent = EN.home.toFixed(2) + " kW";
    return;
  }
  if(apiOK === null) return;
  const w = [...LIST, ...LIST1F, ...LIST5F].filter(a => a.dev).reduce((s,a)=>s+watt(a),0);
  $("idleHome").textContent = (w/1000).toFixed(2) + " kW";
}

/* 遙控器／鍵盤：首頁 ↑↓ 選樓層、OK 進入；樓層頁 ←→ 換設備、OK/空白暫停、返回鍵回首頁 */
document.addEventListener("keydown", e => {
  if(!$("idle").hidden){ e.preventDefault(); userActive(); return; }  // 待機畫面：任一鍵只回原畫面
  if(view === "home"){
    if(e.key === "ArrowUp" || e.key === "ArrowDown"){
      const k = MENU.indexOf(sel), d = e.key === "ArrowUp" ? -1 : 1;
      sel = MENU[(k + d + MENU.length) % MENU.length]; drawSel(); e.preventDefault();
    } else if(e.key === "Enter" || e.key === " "){ if(sel >= 0) enter(sel); e.preventDefault(); }
  } else {
    if(e.key === "ArrowRight") show(cur+1);
    else if(e.key === "ArrowLeft") show(cur-1);
    else if(e.key === " " || e.key === "Enter"){ setHeld(!held); e.preventDefault(); return; }
    else if(["Escape","Backspace","ArrowUp","Home","BrowserBack","GoBack"].includes(e.key)){ goHome(); e.preventDefault(); }
  }
  userActive();
});
$("homeBtn").addEventListener("click", goHome);
[$("hpause"), $("fpause")].forEach(b => b.addEventListener("click", e => { e.stopPropagation(); setHeld(!held); }));

/* 畫面更新（v31：數值來自 API，不再亂數跳動） */
function tick(){
  [...LIST, ...LIST1F, ...LIST5F].forEach(a => { a.hist.push(watt(a)); a.hist.shift(); });
  $("total").textContent = Math.round(L.reduce((s,a)=>s+watt(a),0)).toLocaleString("en-US");
  if(view === "floor"){ updateWin(); updateRank(); } else drawHome();
  drawIdle();
}
function clock(){ const d = new Date(); $("clock").textContent = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
window.addEventListener("resize", () => { if(view === "floor"){ place(); placeDots(); } });

buildHome(); drawHome(); drawSel(); clock(); drawMode(); drawBadge(); tick(); poll();
idleT = setTimeout(startAuto, IDLE_MS);
setInterval(tick, 1500); setInterval(clock, 10000); setInterval(poll, POLL_MS);
pollEnergy(); setInterval(pollEnergy, 10000);
</script>

</body></html>
